# Railway: attach a persistent volume at /app/data (or project data dir).
# Set env from .env.example in the Railway dashboard. Never commit secrets.
# Dockerfile CMD runs scripts/start-all.sh (Next + agent-loop).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
